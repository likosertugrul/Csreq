<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>csreq logo seçenekleri</title>
  <style>
    body { background: #0d0d0d; color: #e0d0c0; font-family: Georgia, serif; padding: 40px; margin: 0; }
    h1 { font-size: 1.2rem; font-weight: 400; letter-spacing: 0.1em; opacity: 0.5; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 32px; max-width: 800px; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .box { width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(224,120,48,0.15); border-radius: 16px; background: rgba(224,120,48,0.04); }
    .box img { width: 80px; height: 80px; }
    .label { font-size: 0.68rem; opacity: 0.4; letter-spacing: 0.08em; }
    .desc { font-size: 0.62rem; opacity: 0.3; text-align: center; max-width: 80px; }
    hr { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 40px 0; }
    .large { display: grid; grid-template-columns: repeat(5, 1fr); gap: 32px; max-width: 800px; }
    .large .box { width: 120px; height: 120px; border-radius: 24px; }
    .large .box img { width: 120px; height: 120px; }
  </style>
</head>
<body>
  <h1>csreq / logo seçenekleri</h1>
  <div class="grid">
    <div class="item">
      <div class="box"><img src="logo-01.svg"></div>
      <div class="label">01</div>
      <div class="desc">cr monogram</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-02.svg"></div>
      <div class="label">02</div>
      <div class="desc">envelope + orbit</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-03.svg"></div>
      <div class="label">03</div>
      <div class="desc">couch + arc</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-04.svg"></div>
      <div class="label">04</div>
      <div class="desc">quill + dots</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-05.svg"></div>
      <div class="label">05</div>
      <div class="desc">circular arrow</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-06.svg"></div>
      <div class="label">06</div>
      <div class="desc">compass star</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-07.svg"></div>
      <div class="label">07</div>
      <div class="desc">document + ring</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-08.svg"></div>
      <div class="label">08</div>
      <div class="desc">house + ring</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-09.svg"></div>
      <div class="label">09</div>
      <div class="desc">host + guest</div>
    </div>
    <div class="item">
      <div class="box"><img src="logo-10.svg"></div>
      <div class="label">10</div>
      <div class="desc">"c" letterform</div>
    </div>
  </div>
  <hr>
  <p style="opacity:0.3; font-size:0.7rem; font-family:monospace">Tüm logolar animasyonlu — dönüşü görmek için tarayıcıda aç.</p>
</body>
</html>
